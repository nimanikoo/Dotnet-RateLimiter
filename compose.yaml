version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: rate-limit-redis
    ports:
      - "6379:6379"
    networks:
      - ratelimit-network

  api:
    image: ratelimiter-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimiter-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379,abortConnect=false
    depends_on:
      - redis
    networks:
      - ratelimit-network

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:8001"
    depends_on:
      - redis
    networks:
      - ratelimit-network

networks:
  ratelimit-network:
    driver: bridge